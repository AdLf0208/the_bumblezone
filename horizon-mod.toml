values, with a /the_bumblezone spawners <biome:id> readout proved in game. The dimension ids and
dimension_type values are as in 0.1.0. The Java terrain and configured features stay recorded as
gaps; every art asset is regenerated (upstream art is All Rights Reserved)."""
